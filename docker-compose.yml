version: "3.9"
# Sovereign Wazuh SIEM — docker-compose
# Usage: docker-compose up --build

services:
  wazuh-siem:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-wazuh-siem:latest
    container_name: sovereign-wazuh-siem
    restart: unless-stopped
    ports:
      - "8808:8808"
    environment:
      SBB_WAZUH_API_URL: ${SBB_WAZUH_API_URL}
      SBB_WAZUH_API_USER: ${SBB_WAZUH_API_USER}
      SBB_WAZUH_API_PASSWORD: ${SBB_WAZUH_API_PASSWORD}
      SBB_COMPLIANCE_FRAMEWORK: ${SBB_COMPLIANCE_FRAMEWORK}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8808
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8808/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
